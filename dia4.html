<script>


    function apagar(){
        localStorage.removeItem('meuDiario');
        //remove lá o item
        document.getElementById('mostra').innerText='';
        //atualiza para mostrar isso dentro do mostra
        document.getElementById('diario').value='';
        //atualiza também

    }

    function salvar(){
        let texto=document.getElementById('diario').value;
        // cria uma variavel que é o que está dentro do diario
        localStorage.setItem('meuDiario',texto);
        //ai você vai criar um item com aquele valor da variavel
        mostrar();
        //chama a outra função
    }

    function mostrar(){
        let salvo = localStorage.getItem('meuDiario');
        //cria uma nova variavel, e pega o que está escrito que salvamos anteriormente.
        document.getElementById('mostra').innerText=salvo;
        //agora pega e deixa a mesma coisa nos dois.

    }

   


</script>
